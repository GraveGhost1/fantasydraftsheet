<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Draft Sheet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="username-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h2>Enter your name</h2>
        <p>Your draft sheet will be saved under this name with password protection.</p>
        <input id="username-input" type="text" placeholder="Your name" maxlength="30" />
        <input id="password-input" type="password" placeholder="Password" maxlength="50" />
        <button id="username-submit">Start drafting</button>
        <button id="username-cancel" class="ghost">Cancel</button>
      </div>
    </div>
    
    <div class="app-shell">
      <header class="top-bar">
        <div class="logo-section">
          <h1>Fantasy Draft Sheet</h1>
        </div>
        <div class="settings-bar">
          <select id="scoring-format" class="compact-select">
            <option value="standard">Standard</option>
            <option value="half">Half-PPR</option>
            <option value="ppr">PPR</option>
          </select>
          <select id="qb-slots" class="compact-select">
            <option value="1">1 QB</option>
            <option value="2">2 QB</option>
            <option value="3">3 QB</option>
            <option value="4">4 QB</option>
          </select>
          <select id="rb-slots" class="compact-select">
            <option value="1">1 RB</option>
            <option value="2">2 RB</option>
            <option value="3">3 RB</option>
            <option value="4">4 RB</option>
            <option value="5">5 RB</option>
            <option value="6">6 RB</option>
          </select>
          <select id="wr-slots" class="compact-select">
            <option value="1">1 WR</option>
            <option value="2">2 WR</option>
            <option value="3">3 WR</option>
            <option value="4">4 WR</option>
            <option value="5">5 WR</option>
            <option value="6">6 WR</option>
          </select>
          <select id="te-slots" class="compact-select">
            <option value="1">1 TE</option>
            <option value="2">2 TE</option>
            <option value="3">3 TE</option>
            <option value="4">4 TE</option>
          </select>
          <select id="flex-slots" class="compact-select">
            <option value="0">0 FLEX</option>
            <option value="1">1 FLEX</option>
            <option value="2">2 FLEX</option>
            <option value="3">3 FLEX</option>
          </select>
          <label class="checkbox-label">
            <input id="superflex" type="checkbox" />
            Superflex
          </label>
          <button id="auto-rank" class="compact-button">Auto-rank</button>
          <input id="sleeper-draft-id" type="text" placeholder="Sleeper Draft ID" class="compact-input" />
          <button id="submit-sleeper-id" class="compact-button">Submit</button>
        </div>
        <div class="user-section">
          <span id="user-display"></span>
          <button id="login-button" class="ghost compact-button">Login</button>
          <button id="logout-button" class="ghost compact-button" style="display: none;">Logout</button>
        </div>
      </header>

      <div class="main-content">
        <div class="filters-bar">
          <div class="position-filters" id="position-filters" aria-label="Position filters">
            <button type="button" class="chip-filter is-active" data-filter="ALL">All</button>
            <button type="button" class="chip-filter" data-filter="QB">QB</button>
            <button type="button" class="chip-filter" data-filter="RB">RB</button>
            <button type="button" class="chip-filter" data-filter="WR">WR</button>
            <button type="button" class="chip-filter" data-filter="TE">TE</button>
            <button type="button" class="chip-filter" data-filter="K">K</button>
            <button type="button" class="chip-filter" data-filter="DEF">DEF</button>
          </div>
          <div class="action-buttons">
            <button id="add-tier" class="ghost compact-button">+ Add Tier</button>
            <button id="delete-tier" class="ghost compact-button">- Delete Tier</button>
            <button id="save-rankings" class="ghost compact-button">Save</button>
            <button id="apply-saved-rankings" class="ghost compact-button">Load</button>
            <button id="reset-board" class="ghost compact-button">Reset Board</button>
          </div>
        </div>

        <div id="ranking-status" class="ranking-status-bar"></div>

        <div class="table-container">
          <table class="rankings-table comparison-table">
            <thead>
              <tr>
                <th data-key="myRank">Rank</th>
                <th data-key="player">Player</th>
                <th data-key="position">Pos</th>
                <th data-key="team">Team</th>
                <th data-key="espn">ESPN</th>
                <th data-key="yahoo">Yahoo</th>
                <th data-key="sleeperAdp">Sleeper</th>
                <th data-key="averageAdp">ADP</th>
              </tr>
            </thead>
            <tbody id="rankings-body"></tbody>
          </table>
        </div>

        <div id="settings-summary" class="status-bar"></div>
        <div id="data-status" class="status-bar"></div>
        
        <div id="unmatched-picks-section" class="unmatched-section" style="display: none;">
          <h3>Unmatched Sleeper Picks</h3>
          <p>These players were drafted in Sleeper but couldn't be matched to your board. Click "Add to Board" to add them.</p>
          <div id="unmatched-picks-list" class="unmatched-list"></div>
          <button id="add-unmatched-to-board" data-action="add-unmatched-to-board" class="compact-button">Add to Board</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
